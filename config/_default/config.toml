baseURL = "https://jianchao.xyz/"
title = "Jianchao Li"
theme = "blowfish"

enableEmoji = true
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"

[outputs]
  home = ["HTML", "RSS", "JSON"]
  # Per-tag feeds were near-duplicates that only added crawl noise.
  # Section feeds stay so existing /posts/index.xml subscribers keep working.
  section = ["HTML", "RSS"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[services]
  [services.googleAnalytics]
    id = "G-DM5XY5K562"
